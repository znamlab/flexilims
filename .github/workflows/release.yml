name: release

# Build the sdist and wheel on tag pushes and publish them as a GitHub Release.
# Linting, type checking and tests run separately in python-uv-ci.yml.

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build_and_release:
    name: Build distributions and create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # setuptools_scm needs the full history to resolve the version from tags
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Build sdist and wheel
        run: uv build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
